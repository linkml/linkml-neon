name: neon_schema
description: LinkML schema for National Ecological Observatory Network (NEON) data.
  This schema models NEON's hierarchical data structure including domains, sites,
  locations, data products, samples, and taxonomic information with cross-links between
  entities.
title: NEON Data Schema
id: https://w3id.org/neon-schema
version: 0.1.0
imports:
- linkml:types
license: MIT
prefixes:
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  neon:
    prefix_prefix: neon
    prefix_reference: https://w3id.org/neon-schema/
  schema:
    prefix_prefix: schema
    prefix_reference: http://schema.org/
  dwc:
    prefix_prefix: dwc
    prefix_reference: http://rs.tdwg.org/dwc/terms/
  wgs84:
    prefix_prefix: wgs84
    prefix_reference: http://www.w3.org/2003/01/geo/wgs84_pos#
  dcterms:
    prefix_prefix: dcterms
    prefix_reference: http://purl.org/dc/terms/
  orcid:
    prefix_prefix: orcid
    prefix_reference: https://orcid.org/
default_prefix: neon
default_range: string
types:
  DomainCode:
    name: DomainCode
    definition_uri: https://w3id.org/neon-schema/DomainCode
    description: Domain code in format D01-D20
    from_schema: https://w3id.org/neon-schema
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^D[0-2][0-9]$
  SiteCode:
    name: SiteCode
    definition_uri: https://w3id.org/neon-schema/SiteCode
    description: Four-character site code
    from_schema: https://w3id.org/neon-schema
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^[A-Z]{4}$
  ProductCode:
    name: ProductCode
    definition_uri: https://w3id.org/neon-schema/ProductCode
    description: Data product code in format DPX.XXXXX.XXX
    from_schema: https://w3id.org/neon-schema
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^DP[0-4]\.[0-9]{5}\.[0-9]{3}$
  YearMonth:
    name: YearMonth
    definition_uri: https://w3id.org/neon-schema/YearMonth
    description: Year-month in YYYY-MM format
    from_schema: https://w3id.org/neon-schema
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^[0-9]{4}-[0-1][0-9]$
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string.   If you are authoring schemas in LinkML YAML, the type is
      referenced with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
enums:
  SiteTypeEnum:
    name: SiteTypeEnum
    definition_uri: https://w3id.org/neon-schema/SiteTypeEnum
    description: Type of NEON field site
    from_schema: https://w3id.org/neon-schema
    permissible_values:
      CORE:
        text: CORE
        description: Core sites selected to represent key ecosystem types
      GRADIENT:
        text: GRADIENT
        description: Gradient sites capturing environmental gradients
  ProductStatusEnum:
    name: ProductStatusEnum
    definition_uri: https://w3id.org/neon-schema/ProductStatusEnum
    description: Status of a data product
    from_schema: https://w3id.org/neon-schema
    permissible_values:
      FUTURE:
        text: FUTURE
        description: Product planned for future release
      ACTIVE:
        text: ACTIVE
        description: Product currently being collected and released
      RETIRED:
        text: RETIRED
        description: Product no longer being collected
  ProductCategoryEnum:
    name: ProductCategoryEnum
    definition_uri: https://w3id.org/neon-schema/ProductCategoryEnum
    description: Data product processing level
    from_schema: https://w3id.org/neon-schema
    permissible_values:
      Level 0:
        text: Level 0
        description: Raw data
      Level 1:
        text: Level 1
        description: Quality-controlled data
      Level 2:
        text: Level 2
        description: Derived data products
      Level 3:
        text: Level 3
        description: Highly processed/modeled data
      Level 4:
        text: Level 4
        description: Integrated data products
  TaxonTypeEnum:
    name: TaxonTypeEnum
    definition_uri: https://w3id.org/neon-schema/TaxonTypeEnum
    description: Major taxonomic groupings used by NEON
    from_schema: https://w3id.org/neon-schema
    permissible_values:
      ALGAE:
        text: ALGAE
        description: Algae taxa
      BEETLE:
        text: BEETLE
        description: Beetle taxa (Carabidae)
      BIRD:
        text: BIRD
        description: Bird taxa
      FISH:
        text: FISH
        description: Fish taxa
      HERPETOLOGY:
        text: HERPETOLOGY
        description: Reptile and amphibian taxa
      MACROINVERTEBRATE:
        text: MACROINVERTEBRATE
        description: Aquatic macroinvertebrate taxa
      MOSQUITO:
        text: MOSQUITO
        description: Mosquito taxa
      MOSQUITO_PATHOGENS:
        text: MOSQUITO_PATHOGENS
        description: Mosquito pathogen taxa
      PLANT:
        text: PLANT
        description: Plant taxa
      SMALL_MAMMAL:
        text: SMALL_MAMMAL
        description: Small mammal taxa
      TICK:
        text: TICK
        description: Tick taxa
  LocationTypeEnum:
    name: LocationTypeEnum
    definition_uri: https://w3id.org/neon-schema/LocationTypeEnum
    description: Types of named locations in NEON hierarchy
    from_schema: https://w3id.org/neon-schema
    permissible_values:
      REALM:
        text: REALM
        description: Top-level realm
      DOMAIN:
        text: DOMAIN
        description: Ecological domain
      SITE:
        text: SITE
        description: Field site
      TOWER:
        text: TOWER
        description: Instrumented tower
      PLOT:
        text: PLOT
        description: Sampling plot
      POINT:
        text: POINT
        description: Observation point
      SENSOR:
        text: SENSOR
        description: Individual sensor location
  MeasurementSystemEnum:
    name: MeasurementSystemEnum
    definition_uri: https://w3id.org/neon-schema/MeasurementSystemEnum
    description: NEON measurement system types
    from_schema: https://w3id.org/neon-schema
    permissible_values:
      AOP:
        text: AOP
        description: Airborne Observation Platform
      AIS:
        text: AIS
        description: Aquatic Instrument System
      AOS:
        text: AOS
        description: Aquatic Observation System
      TIS:
        text: TIS
        description: Terrestrial Instrument System
      TOS:
        text: TOS
        description: Terrestrial Observation System
slots:
  neonDataset__domains:
    name: neonDataset__domains
    description: Collection of NEON domains
    from_schema: https://w3id.org/neon-schema
    slot_uri: neon:domains
    alias: domains
    owner: NeonDataset
    domain_of:
    - NeonDataset
    range: Domain
    multivalued: true
    inlined: true
    inlined_as_list: true
  neonDataset__sites:
    name: neonDataset__sites
    description: Collection of NEON field sites
    from_schema: https://w3id.org/neon-schema
    slot_uri: neon:sites
    alias: sites
    owner: NeonDataset
    domain_of:
    - NeonDataset
    range: Site
    multivalued: true
    inlined: true
    inlined_as_list: true
  neonDataset__locations:
    name: neonDataset__locations
    description: Collection of named locations
    from_schema: https://w3id.org/neon-schema
    slot_uri: neon:locations
    alias: locations
    owner: NeonDataset
    domain_of:
    - NeonDataset
    range: Location
    multivalued: true
    inlined: true
    inlined_as_list: true
  neonDataset__data_products:
    name: neonDataset__data_products
    description: Collection of data products
    from_schema: https://w3id.org/neon-schema
    slot_uri: neon:data_products
    alias: data_products
    owner: NeonDataset
    domain_of:
    - NeonDataset
    range: DataProduct
    multivalued: true
    inlined: true
    inlined_as_list: true
  neonDataset__releases:
    name: neonDataset__releases
    description: Collection of data releases
    from_schema: https://w3id.org/neon-schema
    slot_uri: neon:releases
    alias: releases
    owner: NeonDataset
    domain_of:
    - NeonDataset
    range: Release
    multivalued: true
    inlined: true
    inlined_as_list: true
  neonDataset__taxa:
    name: neonDataset__taxa
    description: Collection of taxonomic records
    from_schema: https://w3id.org/neon-schema
    slot_uri: neon:taxa
    alias: taxa
    owner: NeonDataset
    domain_of:
    - NeonDataset
    range: Taxon
    multivalued: true
    inlined: true
    inlined_as_list: true
  neonDataset__samples:
    name: neonDataset__samples
    description: Collection of physical samples
    from_schema: https://w3id.org/neon-schema
    slot_uri: neon:samples
    alias: samples
    owner: NeonDataset
    domain_of:
    - NeonDataset
    range: Sample
    multivalued: true
    inlined: true
    inlined_as_list: true
  domain__domain_code:
    name: domain__domain_code
    description: Unique domain identifier (D01-D20)
    from_schema: https://w3id.org/neon-schema
    mappings:
    - dcterms:identifier
    slot_uri: dcterms:identifier
    identifier: true
    alias: domain_code
    owner: Domain
    domain_of:
    - Domain
    range: DomainCode
    required: true
  domain__domain_name:
    name: domain__domain_name
    description: Full name of the domain
    from_schema: https://w3id.org/neon-schema
    mappings:
    - schema:name
    slot_uri: schema:name
    alias: domain_name
    owner: Domain
    domain_of:
    - Domain
    range: string
    required: true
  domain__description:
    name: domain__description
    description: Description of the domain's ecological characteristics
    from_schema: https://w3id.org/neon-schema
    mappings:
    - schema:description
    slot_uri: schema:description
    alias: description
    owner: Domain
    domain_of:
    - Domain
    range: string
  domain__sites:
    name: domain__sites
    description: Sites within this domain
    from_schema: https://w3id.org/neon-schema
    slot_uri: neon:sites
    alias: sites
    owner: Domain
    domain_of:
    - Domain
    range: Site
    multivalued: true
    inlined: false
  site__site_code:
    name: site__site_code
    description: Four-character unique site identifier
    from_schema: https://w3id.org/neon-schema
    mappings:
    - dcterms:identifier
    slot_uri: dcterms:identifier
    identifier: true
    alias: site_code
    owner: Site
    domain_of:
    - Site
    range: SiteCode
    required: true
  site__site_name:
    name: site__site_name
    description: Full name of the site
    from_schema: https://w3id.org/neon-schema
    mappings:
    - schema:name
    slot_uri: schema:name
    alias: site_name
    owner: Site
    domain_of:
    - Site
    range: string
    required: true
  site__site_description:
    name: site__site_description
    description: Abbreviated site description
    from_schema: https://w3id.org/neon-schema
    mappings:
    - schema:description
    slot_uri: schema:description
    alias: site_description
    owner: Site
    domain_of:
    - Site
    range: string
  site__site_type:
    name: site__site_type
    description: Whether site is CORE or GRADIENT
    from_schema: https://w3id.org/neon-schema
    slot_uri: neon:site_type
    alias: site_type
    owner: Site
    domain_of:
    - Site
    range: SiteTypeEnum
    required: true
  site__domain:
    name: site__domain
    description: Domain this site belongs to
    from_schema: https://w3id.org/neon-schema
    mappings:
    - schema:containedInPlace
    slot_uri: schema:containedInPlace
    alias: domain
    owner: Site
    domain_of:
    - Site
    range: Domain
    required: true
    inlined: false
  site__latitude:
    name: site__latitude
    description: Site latitude in decimal degrees (WGS84)
    from_schema: https://w3id.org/neon-schema
    mappings:
    - wgs84:lat
    slot_uri: wgs84:lat
    alias: latitude
    owner: Site
    domain_of:
    - Site
    range: decimal
  site__longitude:
    name: site__longitude
    description: Site longitude in decimal degrees (WGS84)
    from_schema: https://w3id.org/neon-schema
    mappings:
    - wgs84:long
    slot_uri: wgs84:long
    alias: longitude
    owner: Site
    domain_of:
    - Site
    range: decimal
  site__elevation:
    name: site__elevation
    description: Site elevation in meters
    from_schema: https://w3id.org/neon-schema
    slot_uri: neon:elevation
    alias: elevation
    owner: Site
    domain_of:
    - Site
    range: decimal
    unit:
      ucum_code: m
  site__state_code:
    name: site__state_code
    description: Two-letter US state code
    from_schema: https://w3id.org/neon-schema
    slot_uri: neon:state_code
    alias: state_code
    owner: Site
    domain_of:
    - Site
    range: string
  site__state_name:
    name: site__state_name
    description: Full state name
    from_schema: https://w3id.org/neon-schema
    slot_uri: neon:state_name
    alias: state_name
    owner: Site
    domain_of:
    - Site
    range: string
  site__deims_id:
    name: site__deims_id
    description: DEIMS-SDR registry identifier
    from_schema: https://w3id.org/neon-schema
    slot_uri: neon:deims_id
    alias: deims_id
    owner: Site
    domain_of:
    - Site
    range: string
  site__available_data_products:
    name: site__available_data_products
    description: Data products available at this site
    from_schema: https://w3id.org/neon-schema
    slot_uri: neon:available_data_products
    alias: available_data_products
    owner: Site
    domain_of:
    - Site
    range: DataProduct
    multivalued: true
    inlined: false
  site__locations:
    name: site__locations
    description: Named locations within this site
    from_schema: https://w3id.org/neon-schema
    slot_uri: neon:locations
    alias: locations
    owner: Site
    domain_of:
    - Site
    range: Location
    multivalued: true
    inlined: false
  location__location_name:
    name: location__location_name
    description: Unique location name identifier
    from_schema: https://w3id.org/neon-schema
    mappings:
    - dcterms:identifier
    slot_uri: dcterms:identifier
    identifier: true
    alias: location_name
    owner: Location
    domain_of:
    - Location
    range: string
    required: true
  location__location_description:
    name: location__location_description
    description: Description of the location
    from_schema: https://w3id.org/neon-schema
    mappings:
    - schema:description
    slot_uri: schema:description
    alias: location_description
    owner: Location
    domain_of:
    - Location
    range: string
  location__location_type:
    name: location__location_type
    description: Type of location in hierarchy
