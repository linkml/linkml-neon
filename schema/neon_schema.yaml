classes:
  NeonDataset:
    name: NeonDataset
    definition_uri: https://w3id.org/neon-schema/NeonDataset
    description: Container for a collection of NEON data entities
    from_schema: https://w3id.org/neon-schema
    slots:
    - neonDataset__domains
    - neonDataset__sites
    - neonDataset__locations
    - neonDataset__data_products
    - neonDataset__releases
    - neonDataset__taxa
    - neonDataset__samples
    attributes:
      domains:
        name: domains
        description: Collection of NEON domains
        range: Domain
        multivalued: true
        inlined_as_list: true
      sites:
        name: sites
        description: Collection of NEON field sites
        range: Site
        multivalued: true
        inlined_as_list: true
      locations:
        name: locations
        description: Collection of named locations
        range: Location
        multivalued: true
        inlined_as_list: true
      data_products:
        name: data_products
        description: Collection of data products
        range: DataProduct
        multivalued: true
        inlined_as_list: true
      releases:
        name: releases
        description: Collection of data releases
        range: Release
        multivalued: true
        inlined_as_list: true
      taxa:
        name: taxa
        description: Collection of taxonomic records
        range: Taxon
        multivalued: true
        inlined_as_list: true
      samples:
        name: samples
        description: Collection of physical samples
        range: Sample
        multivalued: true
        inlined_as_list: true
    class_uri: neon:NeonDataset
    tree_root: true
  Domain:
    name: Domain
    definition_uri: https://w3id.org/neon-schema/Domain
    description: A NEON domain representing a distinct eco-climatic region. NEON divides
      the US into 20 eco-climatic domains.
    from_schema: https://w3id.org/neon-schema
    mappings:
    - schema:Place
    slots:
    - domain__domain_code
    - domain__domain_name
    - domain__description
    - domain__sites
    attributes:
      domain_code:
        name: domain_code
        description: Unique domain identifier (D01-D20)
        slot_uri: dcterms:identifier
        identifier: true
        range: DomainCode
      domain_name:
        name: domain_name
        description: Full name of the domain
        slot_uri: schema:name
        range: string
        required: true
      description:
        name: description
        description: Description of the domain's ecological characteristics
        slot_uri: schema:description
        range: string
      sites:
        name: sites
        description: Sites within this domain
        range: Site
        multivalued: true
        inlined: false
    class_uri: schema:Place
  Site:
    name: Site
    definition_uri: https://w3id.org/neon-schema/Site
    description: A NEON field site where data collection occurs. Sites are either
      CORE (representing key ecosystems) or GRADIENT (capturing environmental gradients).
    from_schema: https://w3id.org/neon-schema
    mappings:
    - schema:Place
    slots:
    - site__site_code
    - site__site_name
    - site__site_description
    - site__site_type
    - site__domain
    - site__latitude
    - site__longitude
    - site__elevation
    - site__state_code
    - site__state_name
    - site__deims_id
    - site__available_data_products
    - site__locations
    attributes:
      site_code:
        name: site_code
        description: Four-character unique site identifier
        slot_uri: dcterms:identifier
        identifier: true
        range: SiteCode
      site_name:
        name: site_name
        description: Full name of the site
        slot_uri: schema:name
        range: string
        required: true
      site_description:
        name: site_description
        description: Abbreviated site description
        slot_uri: schema:description
        range: string
      site_type:
        name: site_type
        description: Whether site is CORE or GRADIENT
        range: SiteTypeEnum
        required: true
      domain:
        name: domain
        description: Domain this site belongs to
        slot_uri: schema:containedInPlace
        range: Domain
        required: true
        inlined: false
      latitude:
        name: latitude
        description: Site latitude in decimal degrees (WGS84)
        slot_uri: wgs84:lat
        range: decimal
      longitude:
        name: longitude
        description: Site longitude in decimal degrees (WGS84)
        slot_uri: wgs84:long
        range: decimal
      elevation:
        name: elevation
        description: Site elevation in meters
        range: decimal
        unit:
          ucum_code: m
      state_code:
        name: state_code
        description: Two-letter US state code
        range: string
      state_name:
        name: state_name
        description: Full state name
        range: string
      deims_id:
        name: deims_id
        description: DEIMS-SDR registry identifier
        range: string
      available_data_products:
        name: available_data_products
        description: Data products available at this site
        range: DataProduct
        multivalued: true
        inlined: false
      locations:
        name: locations
        description: Named locations within this site
        range: Location
        multivalued: true
        inlined: false
    class_uri: schema:Place
  Location:
    name: Location
    definition_uri: https://w3id.org/neon-schema/Location
    description: A named location in NEON's hierarchical location system. Locations
      range from domains to individual sensor positions.
    from_schema: https://w3id.org/neon-schema
    mappings:
    - schema:Place
    slots:
    - location__location_name
    - location__location_description
    - location__location_type
    - location__site
    - location__parent_location
    - location__child_locations
    - location__latitude
    - location__longitude
    - location__elevation
    - location__utm_easting
    - location__utm_northing
    - location__utm_zone
    - location__active_periods
    attributes:
      location_name:
        name: location_name
        description: Unique location name identifier
        slot_uri: dcterms:identifier
        identifier: true
        range: string
      location_description:
        name: location_description
        description: Description of the location
        slot_uri: schema:description
        range: string
      location_type:
        name: location_type
        description: Type of location in hierarchy
        range: LocationTypeEnum
      site:
        name: site
        description: Site this location belongs to
        slot_uri: schema:containedInPlace
        range: Site
        inlined: false
      parent_location:
        name: parent_location
        description: Parent location in hierarchy
        range: Location
        inlined: false
      child_locations:
        name: child_locations
        description: Child locations in hierarchy
        range: Location
        multivalued: true
        inlined: false
      latitude:
        name: latitude
        description: Location latitude in decimal degrees (WGS84)
        slot_uri: wgs84:lat
        range: decimal
      longitude:
        name: longitude
        description: Location longitude in decimal degrees (WGS84)
        slot_uri: wgs84:long
        range: decimal
      elevation:
        name: elevation
        description: Location elevation in meters
        range: decimal
        unit:
          ucum_code: m
      utm_easting:
        name: utm_easting
        description: UTM easting coordinate
        range: decimal
      utm_northing:
        name: utm_northing
        description: UTM northing coordinate
        range: decimal
      utm_zone:
        name: utm_zone
        description: UTM zone number
        range: integer
      active_periods:
        name: active_periods
        description: Time periods when location was active
        range: TimePeriod
        multivalued: true
        inlined_as_list: true
    class_uri: schema:Place
  TimePeriod:
    name: TimePeriod
    definition_uri: https://w3id.org/neon-schema/TimePeriod
    description: A time period with start and optional end date
    from_schema: https://w3id.org/neon-schema
